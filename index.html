    <script>
      // Safeguard against polyfills attempting to reassign read-only window.fetch
      try {
        const _origFetch = window.fetch;
        let _customFetch = _origFetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _customFetch;
          },
          set(val) {
            _customFetch = val;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn('Fetch setter patch skipped:', e);
      }
    </script>
